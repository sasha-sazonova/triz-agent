# name_ru/description_ru (2026-10-30): канон «ТвКТН» 1979 дословно (редакция 1973 на altshuller.ru местами расходится — сверка ОТК в knowledge/drafts/).
principles:
- id: 1
  name: Segmentation
  description: Divide an object into independent parts
  sub_principles:
  - Divide an object into independent parts
  - Make an object easy to disassemble
  - Increase the degree of fragmentation or segmentation
  examples:
  - Modular furniture
  - Sectional sofas
  - Replaceable parts
  name_ru: "Дробление"
  description_ru: "Разделить объект на независимые части, выполнить его разборным или увеличить степень дробления."
- id: 2
  name: Taking out
  description: Separate an interfering part or property from an object
  sub_principles:
  - Separate an interfering part or property from an object
  - Single out the only useful part or property of an object
  - Isolate the harmful or interfering parts
  examples:
  - Noise reduction headphones
  - Water filtration
  - Heat shields
  name_ru: "Вынесение"
  description_ru: "Отделить от объекта «мешающую» часть (свойство) или, наоборот, выделить единственно нужную часть (свойство)."
- id: 3
  name: Local quality
  description: Change the structure from uniform to non-uniform
  sub_principles:
  - Change the structure of an object from uniform to non-uniform
  - Make each part of an object fulfill a different function
  - Make each part of an object work under conditions most suitable for its operation
  examples:
  - Ergonomic tools
  - Multi-zone air conditioning
  - Variable thickness materials
  name_ru: "Местное качество"
  description_ru: "Перейти от однородной структуры объекта (среды, воздействия) к неоднородной: разные части выполняют разные функции и работают в наиболее благоприятных для них условиях."
- id: 4
  name: Asymmetry
  description: Change the shape from symmetrical to asymmetrical
  sub_principles:
  - Change the shape of an object from symmetrical to asymmetrical
  - If an object is asymmetrical, increase its degree of asymmetry
  examples:
  - Asymmetrical car design for aerodynamics
  - Offset handles
  - Unequal wing configurations
  name_ru: "Асимметрия"
  description_ru: "Перейти от симметричной формы объекта к асимметричной; если объект асимметричен — увеличить степень асимметрии."
- id: 5
  name: Merging
  description: Bring closer together identical or similar objects
  sub_principles:
  - Merge identical or similar objects, assemble identical parts to perform parallel
    operations
  - Make operations contiguous or parallel; bring them together in time
  examples:
  - Parallel processing
  - Multi-core processors
  - Assembly line operations
  name_ru: "Объединение"
  description_ru: "Соединить однородные или предназначенные для смежных операций объекты; объединить во времени однородные или смежные операции."
- id: 6
  name: Universality
  description: Make a part or object perform multiple functions
  sub_principles:
  - Make a part or object perform multiple functions, thereby eliminating the need
    for other parts
  examples:
  - Swiss army knife
  - Smartphone (camera, phone, computer)
  - Multi-tool devices
  name_ru: "Универсальность"
  description_ru: "Объект выполняет несколько разных функций, благодаря чему отпадает необходимость в других объектах."
- id: 7
  name: Nesting
  description: Place one object inside another
  sub_principles:
  - Place one object inside another; place each object, in turn, inside the other
  - Make one part pass through a cavity in the other
  examples:
  - Russian dolls
  - Telescoping structures
  - Nested containers
  name_ru: "Матрёшка"
  description_ru: "Разместить один объект внутри другого (который, в свою очередь, находится внутри третьего и т.д.); один объект проходит сквозь полость в другом."
- id: 8
  name: Anti-weight
  description: Compensate for the weight of an object
  sub_principles:
  - To compensate for the weight of an object, merge it with other objects that provide
    lift
  - To compensate for the weight of an object, make it interact with the environment
  examples:
  - Hot air balloons
  - Hydrofoils
  - Magnetic levitation
  name_ru: "Антивес"
  description_ru: "Компенсировать вес объекта соединением с другими объектами, обладающими подъёмной силой, или взаимодействием со средой (аэро- и гидродинамические и другие силы)."
- id: 9
  name: Preliminary anti-action
  description: Perform the opposite action in advance
  sub_principles:
  - If it will be necessary to do an action with both harmful and useful effects,
    this action should be replaced with anti-actions to control harmful effects
  - Create beforehand stresses in an object that will oppose known undesirable working
    stresses later on
  examples:
  - Prestressed concrete
  - Vaccine immunization
  - Pre-loading mechanisms
  name_ru: "Предварительное антидействие"
  description_ru: "Заранее придать объекту напряжения, противоположные недопустимым или нежелательным рабочим напряжениям; если по условиям задачи необходимо действие, заранее совершить антидействие."
- id: 10
  name: Preliminary action
  description: Perform the required change in advance
  sub_principles:
  - Perform, before it is needed, the required change of an object (either fully or
    partially)
  - Pre-arrange objects such that they can come into action from the most convenient
    place
  examples:
  - Pre-cut materials
  - Ready-to-assemble furniture
  - Pre-positioned tools
  name_ru: "Предварительное действие"
  description_ru: "Заранее выполнить требуемое изменение объекта (полностью или хотя бы частично); заранее расставить объекты так, чтобы они могли вступить в действие с наиболее удобного места и без затрат времени на доставку."
- id: 11
  name: Beforehand cushioning
  description: Prepare emergency measures beforehand; compensate for low reliability
    with pre-arranged safety measures
  sub_principles:
  - Prepare emergency measures in advance to handle failures
  - Compensate relatively low reliability with pre-set safety measures (cushions,
    backups, limiters, fail-safes)
  examples:
  - Airbag in cars
  - Reserve parachute
  - Safety valve / fuse
  - UPS backup power
  name_ru: "Заранее подложенная подушка"
  description_ru: "Компенсировать относительно невысокую надёжность объекта заранее подготовленными аварийными средствами."
- id: 12
  name: Equipotentiality
  description: Change working conditions so that objects need not be raised or lowered
  sub_principles:
  - Change working conditions to eliminate the need to raise or lower objects
  - Use gravity-friendly layouts; position work at optimal height
  - Relate objects to a common reference potential
  examples:
  - Gravity-fed pipelines instead of pumping
  - Ground-level assembly, then lift whole unit
  - Spring-loaded part feeders at workstation height
  name_ru: "Эквипотенциальность"
  description_ru: "Изменить условия работы так, чтобы не приходилось поднимать или опускать объект."
- id: 13
  name: The other way round
  description: Invert the action, orientation, arrangement, or process
  sub_principles:
  - Instead of the direct action, do the inverse
  - Make a movable part fixed, and vice versa
  - Turn the object upside down or inside out
  - Use heating instead of cooling (or vice versa)
  examples:
  - Tumble finishing instead of polishing by hand
  - Rotate the pipe instead of the welder
  - Slow-cook at low heat instead of searing
  name_ru: "Наоборот"
  description_ru: "Вместо действия, диктуемого условиями задачи, осуществить обратное действие; сделать движущуюся часть объекта (или внешней среды) неподвижной, а неподвижную — движущейся; перевернуть объект «вверх ногами»."
- id: 14
  name: Spheroidality / Curvature
  description: Use curves instead of straight lines; rotate parts; move from flat
    to spherical
  sub_principles:
  - Replace linear parts/motion with curved ones
  - Use rollers, balls, spirals, domes
  - Switch from linear to rotary motion; use centrifugal effects
  examples:
  - Ball bearings instead of sliding
  - Corrugated panels for stiffness
  - Rotary compressor instead of piston
  name_ru: "Сфероидальность"
  description_ru: "Перейти от прямолинейных частей объекта к криволинейным, от плоских поверхностей к сферическим; использовать ролики, шарики, спирали; перейти к вращательному движению, использовать центробежную силу."
- id: 15
  name: Dynamics
  description: Allow or design the object to be adaptive
  sub_principles:
  - Allow (or design) the object to adapt automatically to optimal operating conditions
  - Divide an object into parts capable of movement relative to each other
  - If an object (or process) is rigid or inflexible, make it movable or adaptive
  examples:
  - Variable compression engines
  - Adjustable suspensions
  - Adaptive optics
  name_ru: "Динамичность"
  description_ru: "Характеристики объекта (или внешней среды) должны меняться так, чтобы быть оптимальными на каждом этапе работы; разделить объект на части, способные перемещаться относительно друг друга; если объект в целом неподвижен — сделать его подвижным."
- id: 16
  name: Partial or excessive actions
  description: If 100% of a goal is hard, do a little more or a little less
  sub_principles:
  - Slightly under- or over-shoot the target to simplify the process
  - Achieve most of the result with much less effort
  examples:
  - Pre-fill to 110% then trim
  - Slightly over-etch to guarantee cleanliness
  - Fill a barrel partly to make pouring easy
  name_ru: "Частичное или избыточное действие"
  description_ru: "Если трудно получить 100% требуемого эффекта, надо получить «чуть меньше» или «чуть больше» — задача при этом может существенно упроститься."
- id: 17
  name: Another dimension
  description: Move to another dimension; use multi-layer or vertical arrangements
  sub_principles:
  - Move an object in two- or three-dimensional space instead of one
  - Use multi-storey layout instead of single-storey
  - Tilt or re-orient the object; use another side of a given area
  examples:
  - Parking garage ramps (spiral)
  - Curved radiator increases area in same footprint
  - Screw threads use helix (2D rotation + 1D advance)
  name_ru: "Переход в другое измерение"
  description_ru: "Устранить трудности, связанные с движением или размещением объекта по линии, переходом на плоскость, а с движением на плоскости — переходом в трёхмерное пространство; многоэтажная компоновка вместо одноэтажной; наклонить объект, положить «набок», использовать обратную сторону площади."
- id: 18
  name: Mechanical vibration
  description: Cause an object to oscillate or vibrate; increase frequency
  sub_principles:
  - Make an object vibrate or oscillate
  - Increase frequency of oscillation (up to ultrasonic)
  - Use resonance; use piezoelectric vibrators instead of mechanical
  - Use ultrasonic vibrations combined with electromagnetic fields
  examples:
  - Ultrasonic cleaning
  - Vibratory conveyors
  - Resonant frequency mixing of materials
  name_ru: "Использование механических колебаний"
  description_ru: "Привести объект в колебательное движение; если такое движение уже совершается, увеличить его частоту (вплоть до ультразвуковой); использовать резонансную частоту; вместо механических вибраторов применить пьезовибраторы; ультразвук в сочетании с электромагнитными полями."
- id: 19
  name: Periodic action
  description: Replace continuous action with periodic or pulsed
  sub_principles:
  - Replace continuous action with periodic/pulsed action
  - Vary amplitude or frequency of the periodic action
  - Use pauses between impulses to perform another action
  examples:
  - Pulsed watering saves water
  - Pulse welding reduces heat distortion
  - 'Heartbeat of the process: fill-pause-drain'
  name_ru: "Периодическое действие"
  description_ru: "Перейти от непрерывного действия к периодическому (импульсному); если действие уже периодическое — изменить периодичность; использовать паузы между импульсами для другого действия."
- id: 20
  name: Continuity of useful action
  description: Carry on work continuously; make all parts work at full load all the
    time
  sub_principles:
  - Make continuous operation of an object; eliminate idle runs
  - Reverse to idle motion of the object (make the tool move instead)
  - Use inertial to store energy between pulses
  examples:
  - Continuous casting
  - Flywheel energy storage
  - Rotate tool instead of the part
  name_ru: "Непрерывность полезного действия"
  description_ru: "Вести работу непрерывно: все части объекта должны всё время работать с полной нагрузкой; устранить холостые и промежуточные ходы."
- id: 21
  name: Skipping / Rushing
  description: Conduct harmful or hazardous process quickly/at high speed
  sub_principles:
  - Conduct a process or its stages at high speed
  - Do the harmful step so fast that damage cannot develop
  examples:
  - Quench steel instantly
  - High-speed cutting avoids heat-affected zone
  - Flash pasteurization
  - Rapid mold release before adhesion forms
  name_ru: "Проскок"
  description_ru: "Вести процесс или отдельные его этапы (например, вредные или опасные) на большой скорости."
- id: 22
  name: Blessing in disguise / Convert harm into benefit
  description: Exploit harm or waste; combine harms to cancel; remove the harmful
    factor by adding another
  sub_principles:
  - Use waste (material/energy/info) from one process in another
  - Combine two harmful factors to neutralize them
  - Intensify the harm until it becomes harmless/useless
  examples:
  - Use waste heat for preheating
  - Acid + base waste neutralize each other
  - Counterweight from scrap metal
  name_ru: "Обратить вред в пользу"
  description_ru: "Использовать вредные факторы (в частности, вредное воздействие среды) для получения положительного эффекта; устранить вредный фактор сложением с другим вредным фактором; усилить вредный фактор до такой степени, чтобы он перестал быть вредным."
- id: 23
  name: Feedback
  description: Introduce feedback to improve a process or action
  sub_principles:
  - 'Introduce feedback: measure results and adjust input'
  - If feedback already exists, change its magnitude or influence
  examples:
  - Thermostat control
  - Self-adjusting bearing clearance
  - Adaptive suspension reacts to road
  name_ru: "Обратная связь"
  description_ru: "Ввести обратную связь; если обратная связь уже есть — изменить её."
- id: 24
  name: Intermediary
  description: Use an intermediary carrier article or process
  sub_principles:
  - Use an intermediary substance or process to transfer/transform action
  - Merge one object temporarily with another (easily separable later)
  examples:
  - Flux in soldering
  - Mechanic's gripper holds the part
  - Catalyst speeds reaction without being consumed
  name_ru: "Посредник"
  description_ru: "Использовать промежуточный объект — носитель действия; временно соединить объект с другим (легко отделяемым) предметом."
- id: 25
  name: Self-service
  description: Make an object serve itself; use waste resources/energy
  sub_principles:
  - Make the object service/repair itself
  - Use waste energy/materials from the object to assist the process
  - Self-compensating, self-balancing arrangements
  examples:
  - Self-sharpening plow blade
  - Regenerative braking charges battery
  - Self-cleaning oven burns off residue
  name_ru: "Самообслуживание"
  description_ru: "Объект должен сам себя обслуживать, выполняя вспомогательные и ремонтные операции; использовать отходы энергии и вещества."
- id: 26
  name: Copying
  description: Use simple inexpensive copies instead of unavailable/fragile originals
  sub_principles:
  - Replace an object/system with a simple copy
  - Replace an object with optical or acoustic copies (images, sound)
  - Use scaled-up or scaled-down / virtual models instead of the real object
  examples:
  - Photograph instead of sampling in person
  - Simulation instead of physical test
  - 3D-printed mock-up for fit checks
  - Virtual wind tunnel
  name_ru: "Копирование"
  description_ru: "Вместо недоступного, сложного, дорогостоящего, неудобного или хрупкого объекта использовать его упрощённые и дешёвые копии; заменить объект (систему объектов) оптическими копиями (изображениями) с изменением масштаба; перейти от видимых копий к инфракрасным или ультрафиолетовым."
- id: 27
  name: Cheap short-living objects
  description: Replace an expensive durable object with many cheap disposable ones
  sub_principles:
  - Replace an expensive object with multiple cheap ones, sacrificing quality (partial
    loss)
  - Expendable cheap objects for short-term duty
  examples:
  - Disposable paper gowns
  - Single-use molds from sand
  - Sacrificial anode corrodes to protect
  name_ru: "Дешёвая недолговечность взамен дорогой долговечности"
  description_ru: "Заменить дорогой объект набором дешёвых объектов, поступившись при этом некоторыми качествами (например, долговечностью)."
- id: 28
  name: Mechanics substitution
  description: Replace mechanical means with sensory/optical/acoustic/electromagnetic
    fields
  sub_principles:
  - 'Replace mechanical fields/interactions with fields: electromagnetic, optical,
    acoustic'
  - Interact with fields instead of objects (contactless)
  - Change from static to mobile fields; from unstructured to structured
  examples:
  - Magnetic coupling through a sealed wall
  - Induction heating instead of flame
  - Laser alignment instead of rods
  name_ru: "Замена механической схемы"
  description_ru: "Заменить механическую систему оптической, акустической или «запаховой»; использовать электрические, магнитные и электромагнитные поля для взаимодействия с объектом; перейти от неподвижных полей к движущимся, от фиксированных — к меняющимся во времени, от неструктурированных — к структурированным; использовать поля в сочетании с ферромагнитными частицами."
- id: 29
  name: Pneumatics and hydraulics
  description: Use gas and liquid instead of solid parts
  sub_principles:
  - Use gas or liquid as working elements instead of solids
  - Inflate/fill with fluid; use air/hydraulic cushioning
  - Use fluidized beds; use bubbles/foam
  examples:
  - Air bags
  - Hydraulic lift
  - Inflatable structures; air bearings
  name_ru: "Использование пневмо- и гидроконструкций"
  description_ru: "Вместо твёрдых частей объекта использовать газообразные и жидкие: надувные и гидронаполняемые, воздушную подушку, гидростатические и гидрореактивные."
- id: 30
  name: Flexible shells and thin films
  description: Use flexible shells and thin films instead of rigid structures
  sub_principles:
  - Isolate the object from environment with flexible shells/thin films
  - Use thin flexible membranes, foil, inflatable constructions
  examples:
  - Inflatable boats/domes
  - Film greenhouse instead of glass
  - Bubble wrap
  name_ru: "Использование гибких оболочек и тонких плёнок"
  description_ru: "Вместо обычных конструкций использовать гибкие оболочки и тонкие плёнки; изолировать объект от внешней среды с их помощью."
- id: 31
  name: Porous materials
  description: Make an object porous or add porous elements
  sub_principles:
  - Make an object porous or add porous elements (inserts, coatings)
  - If already porous, fill pores with a useful substance
  examples:
  - Powder metallurgy parts self-lubricate (oil in pores)
  - Porous bearings
  - Foam metal for light stiff parts
  name_ru: "Применение пористых материалов"
  description_ru: "Выполнить объект пористым или добавить пористые элементы (вставки, покрытия); если объект уже пористый, предварительно заполнить поры полезным веществом."
- id: 32
  name: Color changes
  description: Change the color or transparency of an object or its environment
  sub_principles:
  - Change color/transparency of object or environment
  - Use colored additives or tracers to observe processes
  - Use luminescent/IR markers; change emissivity
  examples:
  - Photochromic lenses
  - Thermal imaging paint for hot spots
  - Color indicator reveals leaks
  name_ru: "Изменение окраски"
  description_ru: "Изменить окраску или степень прозрачности объекта (внешней среды); для наблюдения за плохо видимыми объектами и процессами использовать красящие добавки, а если они уже применяются — меченые атомы."
- id: 33
  name: Homogeneity
  description: Make interacting objects of the same material (or nearly the same)
  sub_principles:
  - Make interacting objects from the same material or one with similar properties
  - Identical materials avoid corrosion pairs and contamination
  examples:
  - Ice bullets of frozen same-material
  - Graft from own tissue
  - Containers of the same material as contents (no contamination)
  name_ru: "Однородность"
  description_ru: "Объекты, взаимодействующие с данным объектом, должны быть сделаны из того же материала (или близкого ему по свойствам)."
- id: 34
  name: Discarding and recovering
  description: Discard useless parts once used; restore consumables in-place
  sub_principles:
  - After a function is done, make the part disappear (dissolve, evaporate, melt)
  - Restore consumable parts directly in operation
  examples:
  - Biodegradable sutures dissolve
  - Dissolvable capsule shell
  - Self-healing coatings; recharge in situ
  name_ru: "Отброс и регенерация частей"
  description_ru: "Выполнившая своё назначение или ставшая ненужной часть объекта должна быть отброшена (растворена, испарена и т.д.) или видоизменена непосредственно в ходе работы; расходуемые части объекта должны быть восстановлены непосредственно в ходе работы."
- id: 35
  name: Parameter changes
  description: Change an object's physical or chemical state
  sub_principles:
  - Change the physical and/or chemical states of an object
  - Change the concentration or consistency
  - Change the degree of flexibility
  - Change the temperature
  examples:
  - Phase-change materials
  - Smart materials
  - Variable viscosity fluids
  name_ru: "Изменение агрегатного состояния объекта"
  description_ru: "Изменить физико-химические параметры объекта: агрегатное состояние, концентрацию или консистенцию, степень гибкости, температуру."
- id: 36
  name: Phase transitions
  description: Use phenomena occurring during phase transitions
  sub_principles:
  - Exploit volume/latent-heat/property changes at phase change
  - Melting, evaporation, condensation, sublimation, freezing for effect
  examples:
  - Heat pipe uses evaporation-condensation cycle
  - Shape-memory alloy (solid-solid transition)
  - Ice expand to grip parts
  name_ru: "Применение фазовых переходов"
  description_ru: "Использовать явления, возникающие при фазовых переходах: изменение объёма, выделение или поглощение тепла и т.д."
- id: 37
  name: Thermal expansion
  description: Use thermal expansion or contraction of materials
  sub_principles:
  - Use expansion/contraction from heating/cooling
  - Use dissimilar expansion coefficients of bimetal
  examples:
  - Shrink-fit assembly (heat hub, cool shaft)
  - Bimetal thermostat bends
  - Thermal-expansion voids take up slack
  name_ru: "Применение теплового расширения"
  description_ru: "Использовать тепловое расширение (или сжатие) материалов; несколько материалов с разными коэффициентами теплового расширения (например, биметалл)."
- id: 38
  name: Strong oxidants
