# name_ru/description_ru (2026-10-30): поколение АРИЗ-85В/85С («движущийся объект», «Длительность действия», «Внешние вредные факторы»); редакция 1973 (altshuller.ru/triz/technique2.asp) даёт «подвижный», «Время действия» и др. — выбор позднего канона зафиксирован решением владельца по умолчанию.
parameters:
