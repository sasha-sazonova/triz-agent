id: classic-03
source: "Классика ТРИЗ — окраска моста распылителем (адаптация)"
problem: |
  На заводе красят длинные трубы распылением в камере. Красящий туман оседает на стенках
  камеры. Чтобы стенки не загрязнялись, через щели вдоль стен подают чистый воздух —
  «воздушную завесу». Но компрессор для завесы потребляет много энергии, а при увеличении
  потока завеса срывает краску с изделий. Снизить расход воздуха нельзя — камера быстро
  зарастает краской. Как разделить поток краски и защиту стен?
expected:
  improving: 23   # Loss of substance; валидны 26 (потери вещества) и 31 (вредный фактор)
  worsening: 19   # Use of energy by moving object; валидны 20 (энергия неподв.) и 18 (мощность)
  top3_any_of:
    - [23, 19]
    - [23, 20]
    - [26, 19]
    - [26, 20]
    - [31, 19]
    - [23, 18]
  principles_any_of: [21, 3, 10, 24, 39]
  principles_by_pair:
    "23,19": [35, 18, 24, 5]
    "23,20": [28, 27, 12, 31]
    "26,19": [34, 29, 16, 18]
    "26,20": [3, 35, 31]
    "31,19": [2, 35, 6]
    "23,18": [1, 6, 13]
  must_mention: ["ИКР"]
