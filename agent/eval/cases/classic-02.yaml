id: classic-02
source: "Альтшуллер — задача о телескопической антенне (адаптация)"
problem: |
  Телескопическая антенна на транспорте: чтобы принимать сигнал, она должна быть высокой
  (длинной), но в сложенном виде — короткой, чтобы не ломаться и не мешать. Обычная
  телескопическая система из трубок ненадёжна: контакты между звеньями изнашиваются,
  антенна «дребезжит», электрический контакт пропадает. Нужна антенна, которая длинная,
  когда работает, и короткая при движении, без подвижных трущихся контактов. Как решить?
expected:
  improving: 3    # Length of moving object; валидна также 33 (удобство) / 4 (длина неподв.)
  worsening: 14   # Strength (надёжность); валидны 27 (надёжность) и 30 (внешние вредные ф.)
