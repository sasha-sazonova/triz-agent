id: classic-01
source: "Классика ТРИЗ (радиатор/турбина, адаптация)"
problem: |
  Нужно отливать детали из металла быстрее. Проблема: металлическая форма-изложница
  нагревается от каждой отливки и теряет прочность, приходится делать её массивной и
  толстостенной — а толстая форма хуже отводит тепло, металл застывает медленно,
  производительность падает. Если делать стенку тонкой для быстрого охлаждения —
  форма быстро выходит из строя от перегрева. Как быть?
expected:
  improving: 17   # Temperature; валидны также 22 (потери энергии) и 39 (производительность)
  worsening: 11   # Stress/pressure; валидны также 15 (прочность→время) и 14 (прочность)
  top3_any_of:    # ЛЮБАЯ из валидных формализаций допустима (см. урок smoke-теста)
    - [17, 11]
    - [17, 15]
    - [22, 11]
    - [22, 15]
    - [39, 14]
    - [39, 11]
    - [17, 14]
  principles_any_of: [22, 39, 35, 3, 10]
  principles_by_pair:   # эталонные принципы ДЛЯ КАЖДОЙ валидной пары (полная матрица)
    "17,11": [35, 39, 19, 2]
    "17,15": [19, 13, 39]
    "22,11": [2, 36, 25]
    "22,15": [1, 2, 10, 15, 35]   # пары нет в матрице — частотные
    "39,14": [29, 28, 10, 18]
    "39,11": [10, 37, 14]
    "17,14": [10, 30, 22, 40]
  must_mention: ["ИКР"]
mode: LITE
